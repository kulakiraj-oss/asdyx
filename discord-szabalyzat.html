<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuideMTA - Fejlesztés alatt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #14171c;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .logo-box img {
            width: 100px;
            height: auto;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 2.5rem;
            color: #3b82f6;
            margin-bottom: 10px;
        }

        p {
            color: #a0a5b5;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .back-btn {
            background-color: #28a745;
            color: #ffffff;
            padding: 12px 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="logo-box">
        <img src="./logo.png" alt="GuideMTA Logo">
    </div>

    <h1>Fejlesztés alatt!</h1>
    <p>A Discord szabályzat feltöltése és szerkesztése jelenleg folyamatban van. Kérjük látogass vissza később!</p>

    <a href="szabalyzat.html" class="back-btn">← Vissza a választóhoz</a>

</body>
</html>
